<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VELIX</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct hit on a
      // client-side route (e.g. /portfolio) 404s. This redirects it back
      // to index.html, encoding the original path in the query string so
      // the app can restore it. See https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep "/VelixTech-WebSite"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
