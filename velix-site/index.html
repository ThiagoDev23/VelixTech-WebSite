<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Versioned query string, since browsers cache favicons far more
         aggressively than a normal reload/deploy would otherwise bust. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=4" />
    <!-- viewport-fit=cover lets the page draw under the status bar / Dynamic
         Island on notched phones instead of leaving a plain gap above the
         fixed navbar; env(safe-area-inset-top) (added where the mobile
         navbar's height is used) then keeps its own content clear of the
         notch. Resolves to 0 on every device without one, so nothing here
         changes on other phones or on desktop. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Safari tints its own status bar / Dynamic Island area to match this
         instead of leaving a plain default block there; kept in sync with
         whatever section is at the top of the viewport via HomePage.jsx's
         existing scroll-tracked theme state. #14041c (not the flat charcoal
         .hero itself uses) matches the actual average color of the video's
         own top edge, which is what's visibly behind the status bar on
         first paint, before that JS runs. -->
    <meta name="theme-color" content="#14041c" />
    <meta name="description" content="VELIX — Soluções tecnológicas para empresas. Websites, SaaS e gestão de tráfego." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
    <title>Velix Tech</title>
    <style>
      /* Covers the gap between first paint and the JS bundle finishing
         download+parse+execute - on a slow connection that can otherwise be
         several seconds of a plain blank dark screen with zero feedback.
         Inlined (not in an external stylesheet) so it renders even if the
         app's own CSS hasn't loaded yet. createRoot().render() in main.jsx
         replaces #root's entire contents the moment React mounts, which
         removes this automatically - no cleanup JS needed. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0d0d;
      }
      .initial-loader__spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgb(187, 44, 255);
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader__spinner {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <script>
      // Restore the original path after the 404.html redirect trick (GitHub Pages SPA fallback).
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" aria-hidden="true">
        <div class="initial-loader__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
